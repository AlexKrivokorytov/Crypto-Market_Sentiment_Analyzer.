server {
    listen 80;
    server_name localhost;

    # ── SPA routing ────────────────────────────────────────────────────────────
    # All non-asset requests fall back to index.html for Vue Router history mode.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ───────────────────────────────────────────────────────
    # Proxies /api/v1/* to the FastAPI backend container so the frontend
    # bundle does not need to know the backend hostname at build time.
    # This is the primary path for all REST endpoints including /chat.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # LLM calls can take up to 30s on OpenRouter free tier — give them room.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }



    # ── Error pages ─────────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
