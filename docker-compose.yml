services:
  mongodb:
    image: mongo:6.0
    container_name: sentiment_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentiment_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    # Uses the DB-bypass /api/v1/healthz warmup route so Render health pings
    # succeed instantly without triggering a MongoDB round-trip.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >
          import urllib.request, sys;
          r = urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=8);
          sys.exit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentiment_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
